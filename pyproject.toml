[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defects"
version = "1.0.0"
description = "Visual defect detection on MVTec AD with PatchCore, inspection triage and an HTTP service"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
